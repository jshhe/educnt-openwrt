name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "OpenWrt release to build against"
        required: false
        default: "25.12.5"

permissions:
  contents: read

jobs:
  build:
    name: OpenWrt ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "24.10.4"
            sdk: "openwrt-sdk-24.10.4-ramips-mt7621_gcc-13.3.0_musl.Linux-x86_64.tar.zst"
          - version: "25.12.5"
            sdk: "openwrt-sdk-25.12.5-ramips-mt7621_gcc-14.3.0_musl.Linux-x86_64.tar.zst"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential rsync zstd wget

      - name: Download SDK
        run: |
          BASE="https://downloads.openwrt.org/releases/${{ matrix.version }}/targets/ramips/mt7621"
          wget -q "$BASE/${{ matrix.sdk }}"
          wget -q "$BASE/sha256sums"
          grep "${{ matrix.sdk }}" sha256sums > sdk.sha256
          sha256sum -c sdk.sha256
          tar --zstd -xf "${{ matrix.sdk }}"

      - name: Add feed and install package
        run: |
          SDK_DIR=$(find . -maxdepth 1 -type d -name 'openwrt-sdk-*' | head -n 1)
          cd "$SDK_DIR"
          cp feeds.conf.default feeds.conf 2>/dev/null || true
          echo "src-link educnt $GITHUB_WORKSPACE" >> feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        run: |
          SDK_DIR=$(find . -maxdepth 1 -type d -name 'openwrt-sdk-*' | head -n 1)
          cd "$SDK_DIR"
          echo "CONFIG_PACKAGE_educnt=m" >> .config
          make defconfig

      - name: Build package
        run: |
          SDK_DIR=$(find . -maxdepth 1 -type d -name 'openwrt-sdk-*' | head -n 1)
          cd "$SDK_DIR"
          make package/educnt/compile V=s -j"$(nproc)"

      - name: Collect artifacts
        run: |
          mkdir -p out
          find . -type f -path './openwrt-sdk-*/bin/packages/*' \( -name 'educnt*.ipk' -o -name 'educnt*.apk' \) -exec cp {} out/ \;
          ls -l out

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: educnt-${{ matrix.version }}
          path: out/*
          if-no-files-found: error

  release:
    name: Publish release
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          generate_release_notes: true

      - name: Update rolling latest build
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --repo "${{ github.repository }}" --yes --cleanup-tag 2>/dev/null || true

      - name: Publish rolling latest release
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          files: artifacts/**/*
          body: |
            自动构建（`latest`），每次推送到默认分支都会更新。

            对应提交：${{ github.sha }}
