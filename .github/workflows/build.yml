name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "OpenWrt release to build against"
        required: false
        default: "25.12.5"

permissions:
  contents: read

jobs:
  build:
    name: OpenWrt ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "24.10.4"
            sdk: "openwrt-sdk-24.10.4-ramips-mt7621_gcc-13.3.0_musl.Linux-x86_64.tar.zst"
          - version: "25.12.5"
            sdk: "openwrt-sdk-25.12.5-ramips-mt7621_gcc-14.3.0_musl.Linux-x86_64.tar.zst"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential rsync zstd wget

      - name: Download SDK
        run: |
          BASE="https://downloads.openwrt.org/releases/${{ matrix.version }}/targets/ramips/mt7621"
          wget -q "$BASE/${{ matrix.sdk }}"
          wget -q "$BASE/sha256sums"
          grep "${{ matrix.sdk }}" sha256sums > sdk.sha256
          sha256sum -c sdk.sha256
          tar --zstd -xf "${{ matrix.sdk }}"

      - name: Add feed and install package
        run: |
          SDK_DIR=$(find . -maxdepth 1 -type d -name 'openwrt-sdk-*' | head -n 1)
          cd "$SDK_DIR"
          cp feeds.conf.default feeds.conf 2>/dev/null || true
          echo "src-link educnt $GITHUB_WORKSPACE" >> feeds.conf
          {
            ./scripts/feeds update -a
            ./scripts/feeds install -a
            echo "--- package/feeds/educnt ---"
            ls -l package/feeds/educnt 2>&1 || true
          } 2>&1 | tee /tmp/feeds.log

      - name: Configure
        run: |
          cd openwrt-sdk-*
          echo "CONFIG_PACKAGE_educnt=m" >> .config
          [ -e package/feeds/educnt ] || echo "::warning title=feed::package/feeds/educnt missing"
          set +e
          make defconfig V=s > /tmp/defconfig.log 2>&1
          rc=$?
          echo "defconfig rc=$rc"
          tail -n 120 /tmp/defconfig.log
          tail -n 40 /tmp/defconfig.log | while IFS= read -r l; do
            echo "::error title=defconfig::$l"
          done
          {
            echo "### defconfig rc=$rc"
            echo '```'
            tail -n 120 /tmp/defconfig.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Build package
        run: |
          cd openwrt-sdk-*
          make package/educnt/compile V=s -j"$(nproc)"

      - name: Collect artifacts
        run: |
          mkdir -p out
          find openwrt-sdk-* -path '*/bin/packages/*' \( -name '*.ipk' -o -name '*.apk' \) -exec cp {} out/ \;
          ls -l out

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: educnt-${{ matrix.version }}
          path: out/*
          if-no-files-found: error

  release:
    name: Attach packages to release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
