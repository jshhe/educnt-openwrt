name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "OpenWrt release to build against"
        required: false
        default: "25.12.5"

permissions:
  contents: read

jobs:
  build:
    name: OpenWrt ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "24.10.4"
            sdk: "openwrt-sdk-24.10.4-ramips-mt7621_gcc-13.3.0_musl.Linux-x86_64.tar.zst"
          - version: "25.12.5"
            sdk: "openwrt-sdk-25.12.5-ramips-mt7621_gcc-14.3.0_musl.Linux-x86_64.tar.zst"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential rsync zstd wget

      - name: Download SDK
        run: |
          BASE="https://downloads.openwrt.org/releases/${{ matrix.version }}/targets/ramips/mt7621"
          wget -q "$BASE/${{ matrix.sdk }}"
          wget -q "$BASE/sha256sums"
          grep "${{ matrix.sdk }}" sha256sums > sdk.sha256
          sha256sum -c sdk.sha256
          tar --zstd -xf "${{ matrix.sdk }}"

      - name: Add feed and install package
        run: |
          SDK_DIR=$(find . -maxdepth 1 -type d -name 'openwrt-sdk-*' | head -n 1)
          cd "$SDK_DIR"
          cp feeds.conf.default feeds.conf 2>/dev/null || true
          echo "src-link educnt $GITHUB_WORKSPACE" >> feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        run: |
          SDK_DIR=$(find . -maxdepth 1 -type d -name 'openwrt-sdk-*' | head -n 1)
          cd "$SDK_DIR"
          echo "CONFIG_PACKAGE_educnt=m" >> .config
          make defconfig

      - name: Build package
        run: |
          SDK_DIR=$(find . -maxdepth 1 -type d -name 'openwrt-sdk-*' | head -n 1)
          cd "$SDK_DIR"
          make package/educnt/compile V=s -j"$(nproc)"

      - name: Collect artifacts
        run: |
          mkdir -p out
          find . -type f -path './openwrt-sdk-*/bin/packages/*' \( -name '*.ipk' -o -name '*.apk' \) -exec cp {} out/ \;
          ls -l out

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: educnt-${{ matrix.version }}
          path: out/*
          if-no-files-found: error

  release:
    name: Attach packages to release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Publish release assets
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
